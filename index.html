<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon/favicon.png">
    <title>What's For Dinner</title>
    <link rel="stylesheet" href="css/font-awesome.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">

</head>

<body>
    <div class="container">

        <header>
            <div class="top-header">
                <div class="left-section">
                    <i class="fa-solid fa-utensils"></i>
                    <div class="headers">
                        <h1>What's For Dinner</h1>
                        <span>What's For Dinner</span>
                    </div>
                </div>
                <div class="right-section">
                    <i class="fa-solid fa-bookmark"></i>
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <i class="fa-solid fa-gear"></i>
                    <div class="figure">
                        <img src="images/avatar-4.jpg" alt="profile-picture">
                    </div>
                </div>
            </div>
        </header>
        <main>
            <article class="meal">


                <section class="meal-image">
                    <div class="rating-container">
                        <i class="fa-solid fa-star"></i>
                        <span class="rating">4.8</span>
                        <span class="reviews">(356 reviews)</span>
                    </div>

                    <div class="bottom-container">
                        <div class="prep-time">
                            <i class="fa-solid fa-clock"></i>
                            <span>Prep Time</span>
                            <span class="prep-minutes">10 min</span>
                        </div>
                        <div class="cook-time">
                            <i class="fa-solid fa-fire-burner"></i>
                            <span>Cook Time</span>
                            <span class="cook-time">15 min</span>
                        </div>
                        <div class="serving">
                            <i class="fa-solid fa-users"></i>
                            <span>Servings</span>
                            <span class="serving-people">2 people</span>
                        </div>
                    </div>
                </section>
                <section class="meal-info">
                    <span class="difficulty">Easy</span>
                    <span class="food-category">Seafood</span>
                    <div class="left-section">
                        <h2 class="meal-name">Shrimp Scampi</h2>
                        <span class="meal-description">Garlicky shrimp in white wine butter sauce</span>
                    </div>
                    <div class="right-section">

                        <i class="fa-solid fa-bookmark"></i>
                        <i class="fa-solid fa-share-nodes"></i>
                    </div>
   










                    <ul class="nav nav-tabs" id="myTab" role="tablist">
                        <li class="nav-item" role="presentation">

                            <button class="nav-link active" id="home-tab" data-bs-toggle="tab"
                                data-bs-target="#home-tab-pane" type="button" role="tab" aria-controls="home-tab-pane"
                                aria-selected="true"> <i class="fa-solid fa-list-check"></i> Ingredients</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="profile-tab" data-bs-toggle="tab"
                                data-bs-target="#profile-tab-pane" type="button" role="tab"
                                aria-controls="profile-tab-pane" aria-selected="false"> <i
                                    class="fa-solid fa-book-open"></i> Instructions</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="contact-tab" data-bs-toggle="tab"
                                data-bs-target="#contact-tab-pane" type="button" role="tab"
                                aria-controls="contact-tab-pane" aria-selected="false"><i
                                    class="fa-solid fa-chart-pie"></i> Nutrition</button>
                        </li>

                        <li class="nav-item" role="presentation"></li>
                        <button class="nav-link" id="contact-tab" data-bs-toggle="tab"
                            data-bs-target="#contact-tab-pane" type="button" role="tab" aria-controls="contact-tab-pane"
                            aria-selected="false"><i class="fa-solid fa-lightbulb"></i> Chef's Tips</button>
                        </li>


                    </ul>
                    <div class="tab-content" id="myTabContent">
                        <div class="tab-pane fade show active" id="home-tab-pane" role="tabpanel"
                            aria-labelledby="home-tab" tabindex="0">...</div>
                        <div class="tab-pane fade" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab"
                            tabindex="0">...</div>
                        <div class="tab-pane fade" id="contact-tab-pane" role="tabpanel" aria-labelledby="contact-tab"
                            tabindex="0">...</div>
                        <div class="tab-pane fade" id="disabled-tab-pane" role="tabpanel" aria-labelledby="disabled-tab"
                            tabindex="0">...</div>
                    </div>
                </section>

            </article>
            <hr/>
            <button><i class="fas fa-rotate"></i>Try Another Recipe</button>
        </main>
    </div>
    <script src="js/font-awesome.js"></script>
    <script src="js/bootstrap.min.js"></script>
</body>

</html>
