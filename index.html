<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon/favicon.png">
    <title>What's For Dinner</title>
    <link rel="stylesheet" href="css/font-awesome.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="container-fluid px-4">

        <header class="py-3">
            <div class="top-header d-flex justify-content-between align-items-center">
                <div class="left-section d-flex gap-3">
                    <div class="icon-container d-flex justify-content-center align-items-center rounded-circle">
                        <i class="fa-solid fa-utensils text-light"></i>

                    </div>
                    <div class="headers">
                        <h1 class="fw-bold fs-4 lh-sm">What's For Dinner</h1>
                        <span class="fw-normal lh-base text-secondary">Your daily meal inspiration</span>
                    </div>
                </div>
                <div class="right-section d-flex gap-4 align-items-center">
                    <i class="fa-solid fa-bookmark"></i>
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <i class="fa-solid fa-gear"></i>
                    <figure class="">
                        <img class="rounded-circle" src="images/avatar-4.jpg" alt="profile-picture">
                    </figure>
                </div>
            </div>
        </header>
    </div>

    <div class="container-fluid px-4">
        <main>
            <article class="meal">


                <section class="meal-image position-relative overflow-hidden">
                    <img class="w-100 h-100 object-fit-cover" src="../images/meals/Honey_Garlic_Salmon.avif" />

                    <div
                        class="rating-container badge text-bg-light py-2 px-3 lh-base justify-content-center align-items-center  position-absolute rounded-pill d-flex gap-2">
                        <i class="fa-solid fa-star text-warning"></i>
                        <span class="rating fw-semibold">4.8</span>
                        <span class="reviews fw-normal text-black-50">(356 reviews)</span>
                    </div>

                    <div class="bottom-container position-absolute p-4">
                        <div class="prep-time">
                            <i class="fa-solid fa-clock"></i>
                            <span>Prep Time</span>
                            <span class="prep-minutes">10 min</span>
                        </div>
                        <div class="cook-time">
                            <i class="fa-solid fa-fire-burner"></i>
                            <span>Cook Time</span>
                            <span class="cook-time">15 min</span>
                        </div>
                        <div class="serving">
                            <i class="fa-solid fa-users"></i>
                            <span>Servings</span>
                            <span class="serving-people">2 people</span>
                        </div>
                    </div>
                </section>
                <section class="meal-info">
                    <span class="difficulty">Easy</span>
                    <span class="food-category">Seafood</span>
                    <div class="left-section">
                        <h2 class="meal-name">Shrimp Scampi</h2>
                        <span class="meal-description">Garlicky shrimp in white wine butter sauce</span>
                    </div>
                    <div class="right-section">

                        <i class="fa-solid fa-bookmark"></i>
                        <i class="fa-solid fa-share-nodes"></i>
                    </div>











                    <ul class="nav nav-tabs" id="myTab" role="tablist">
                        <li class="nav-item" role="presentation">

                            <button class="nav-link active" id="home-tab" data-bs-toggle="tab"
                                data-bs-target="#home-tab-pane" type="button" role="tab" aria-controls="home-tab-pane"
                                aria-selected="true"> <i class="fa-solid fa-list-check"></i> Ingredients</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="profile-tab" data-bs-toggle="tab"
                                data-bs-target="#profile-tab-pane" type="button" role="tab"
                                aria-controls="profile-tab-pane" aria-selected="false"> <i
                                    class="fa-solid fa-book-open"></i> Instructions</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="contact-tab" data-bs-toggle="tab"
                                data-bs-target="#contact-tab-pane" type="button" role="tab"
                                aria-controls="contact-tab-pane" aria-selected="false"><i
                                    class="fa-solid fa-chart-pie"></i> Nutrition</button>
                        </li>

                        <li class="nav-item" role="presentation"></li>
                        <button class="nav-link" id="contact-tab" data-bs-toggle="tab"
                            data-bs-target="#contact-tab-pane" type="button" role="tab" aria-controls="contact-tab-pane"
                            aria-selected="false"><i class="fa-solid fa-lightbulb"></i> Chef's Tips</button>
                        </li>


                    </ul>
                    <div class="tab-content" id="myTabContent">
                        <div class="tab-pane fade show active" id="home-tab-pane" role="tabpanel"
                            aria-labelledby="home-tab" tabindex="0">...</div>
                        <div class="tab-pane fade" id="profile-tab-pane" role="tabpanel" aria-labelledby="profile-tab"
                            tabindex="0">...</div>
                        <div class="tab-pane fade" id="contact-tab-pane" role="tabpanel" aria-labelledby="contact-tab"
                            tabindex="0">...</div>
                        <div class="tab-pane fade" id="disabled-tab-pane" role="tabpanel" aria-labelledby="disabled-tab"
                            tabindex="0">...</div>
                    </div>
                </section>

            </article>
            <hr />
            <button><i class="fas fa-rotate"></i>Try Another Recipe</button>
        </main>
    </div>
    <!-- <script src="js/font-awesome.js"></script> -->
    <script src="js/bootstrap.min.js"></script>
</body>

</html>
