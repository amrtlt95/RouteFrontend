<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon/favicon.png">
    <title>What's For Dinner</title>
    <link rel="stylesheet" href="css/font-awesome.css">
</head>

<body>
    <div class="container">

        <header>
            <div class="top-header">
                <div class="left-section">
                    <i class="fa-solid fa-utensils"></i>
                    <div class="headers">
                        <h1>What's For Dinner</h1>
                        <span>What's For Dinner</span>
                    </div>
                </div>
                <div class="right-section">
                    <i class="fa-solid fa-bookmark"></i>
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <i class="fa-solid fa-gear"></i>
                    <div class="figure">
                        <img src="images/avatar-4.jpg" alt="profile-picture">
                    </div>
                </div>
            </div>
        </header>
        <main>
            <article class="meal">


                <section class="meal-image">
                    <div class="rating-container">
                        <i class="fa-solid fa-star"></i>
                        <span class="rating">4.8</span>
                        <span class="reviews">(356 reviews)</span>
                    </div>

                    <div class="bottom-container">
                        <div class="prep-time">
                            <i class="fa-solid fa-clock"></i>
                            <span>Prep Time</span>
                            <span class="prep-minutes">10 min</span>
                        </div>
                        <div class="cook-time">
                            <i class="fa-solid fa-fire-burner"></i>
                            <span>Cook Time</span>
                            <span class="cook-time">15 min</span>
                        </div>
                        <div class="serving">
                            <i class="fa-solid fa-users"></i>
                            <span>Servings</span>
                            <span class="serving-people">2 people</span>
                        </div>
                    </div>
                </section>
                <section class="meal-info">
                    <span class="difficulty">Easy</span>
                    <span class="food-category">Seafood</span>
                    <div class="left-section">
                        <h2 class="meal-name">Shrimp Scampi</h2>
                        <span class="meal-description">Garlicky shrimp in white wine butter sauce</span>
                    </div>
                    <div class="right-section">

                        <i class="fa-solid fa-bookmark"></i>
                        <i class="fa-solid fa-share-nodes"></i>
                    </div>
                    <div class="meal-actions">
                        <div class="meal-action-button">
                            <i class="fa-solid fa-list-check"></i>
                            <button class="ingredients">Ingredients</button>
                        </div>
                        <div class="meal-action-button">
                            <i class="fa-solid fa-book-open"></i>
                            <button class="ingredients">Instructions</button>
                        </div>
                        <div class="meal-action-button"><i class="fa-solid fa-chart-pie"></i>
                            <button class="ingredients">Nutrition</button>
                        </div>
                        <div class="meal-action-button"> <i class="fa-solid fa-lightbulb"></i> <button
                                class="ingredients">Chef's Tips</button>
                        </div>
                    </div>
                </section>
            </article>
        </main>
    </div>
    <script src="js/font-awesome.js"></script>
</body>

</html>
