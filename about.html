<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/phone-book.png" type="image/x-icon">
    <title>ContactHub - Smart Contact Manager</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

  
  
  
  <div id="contactModal"
        class="modal-overlay position-fixed top-0 start-0 bottom-0 end-0  justify-content-center align-items-center">
        <div class="modal-dialog">
            <div class="modal-container d-flex flex-column w-100">
                <!-- Modal Header -->
                <div class="modal-header border-bottom py-4 px-4">
                    <h2 id="modalTitle" class="h4 fw-bold text-dark mb-0">Add New Contact</h2>
                    <button id="closeModalBtn" type="button" class="btn-close"></button>
                </div>

                <div class="modal-scroll">
                    <!-- Modal Form -->
                    <form id="contactForm" class="p-4">
                        <!-- Avatar Upload -->
                        <div class="text-center mb-4">
                            <div id="avatarPreview" class="avatar-upload mx-auto mb-3">
                                <i class="fas fa-user"></i>
                            </div>
                            <label class="btn btn-light btn-sm d-inline-flex align-items-center gap-2">
                                <i class="fas fa-camera text-muted"></i>
                                <span>Change Photo</span>
                                <!-- because its wrapped in label -->
                                <input type="file" id="avatarInput" accept="image/*" class="d-none">
                            </label>
                            <input type="hidden" id="avatarPath" value="">
                        </div>

                        <!-- Name -->
                        <div class="mb-3">
                            <label class="form-label fw-medium" for="contactName">
                                Full Name <span class="text-danger">*</span>
                            </label>
                            <input type="text" id="contactName" class="form-control form-control-custom"
                                placeholder="Enter full name">
                            <div id="contactNameError" class="invalid-feedback d-none">
                                Name should contain only letters and spaces (2-50 characters)
                            </div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label class="form-label fw-medium" for="contactPhone">
                                Phone Number <span class="text-danger">*</span>
                            </label>
                            <input type="tel" id="contactPhone" class="form-control form-control-custom"
                                placeholder="e.g., 01012345678">
                            <div id="contactPhoneError" class="invalid-feedback d-none">
                                Please enter a valid Egyptian phone number
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-medium" for="contactEmail">Email Address</label>
                            <input type="email" id="contactEmail" class="form-control form-control-custom"
                                placeholder="name@example.com">
                            <div id="contactEmailError" class="invalid-feedback d-none">
                                Please enter a valid email address
                            </div>
                        </div>

                        <!-- Address -->
                        <div class="mb-3">
                            <label class="form-label fw-medium" for="contactAddress">Address</label>
                            <input type="text" id="contactAddress" class="form-control form-control-custom"
                                placeholder="Enter address">
                        </div>

                        <!-- Group -->
                        <div class="mb-3">
                            <label class="form-label fw-medium" for="contactGroup">Group</label>
                            <select id="contactGroup" class="form-select form-control-custom">
                                <option value="">Select a group</option>
                                <option value="family">Family</option>
                                <option value="friends">Friends</option>
                                <option value="work">Work</option>
                                <option value="school">School</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <!-- Notes -->
                        <div class="mb-3">
                            <label class="form-label fw-medium" for="contactNotes">Notes</label>
                            <textarea id="contactNotes" rows="2" class="form-control form-control-custom"
                                placeholder="Add notes about this contact"></textarea>
                        </div>

                        <!-- Checkboxes -->
                        <div class="d-flex flex-wrap gap-4 mb-4">
                            <div class="form-check">
                                <input type="checkbox" id="contactFavorite" class="form-check-input">
                                <label for="contactFavorite" class="form-check-label fw-medium">
                                    <i class="fas fa-star text-warning me-1"></i>Favorite
                                </label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" id="contactEmergency" class="form-check-input">
                                <label for="contactEmergency" class="form-check-label fw-medium">
                                    <i class="fas fa-heart-pulse text-danger me-1"></i>Emergency
                                </label>
                            </div>
                        </div>

                        <input type="hidden" id="contactId" value="">

                        <!-- Form Actions -->
                        <div class="d-flex flex-column-reverse flex-sm-row gap-3">
                            <button type="button" id="cancelModalBtn" class="btn btn-light flex-grow-1 py-3">
                                Cancel
                            </button>
                            <button type="button" id="submitModalBtn" class="btn primary-btn flex-grow-1 py-3" >
                                <i class="fas fa-check me-2"></i>Save Contact
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
